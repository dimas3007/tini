name: Feature request
description: Suggest an idea or improvement for tini.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended ideas, [Discussions](https://github.com/dimas3007/tini/discussions) is a great place to start. tini's promise is staying tiny (about 6–8 MB of RAM and 0% CPU at idle), so proposals that keep it that way are the easiest to accept.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you're in and why it's hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like tini to do?
      description: How it could look or behave in the notch. Sketches are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself.
